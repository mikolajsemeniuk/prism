# vLLM inference server for the ablation experiment, on the ASUS Ascent GX10
# (NVIDIA GB10 Grace-Blackwell, sm_121, 128 GB unified). Based on the proven
# qwen2.5 bf16 block from the kubelean box (same image + flags), swapped to the
# Qwen3-30B-A3B MoE (~3B active → decodes fast, fits bf16 in 128 GB).
#
#   docker compose --profile qwen3 up -d
#   docker compose logs -f
#   docker compose --profile qwen3 down
#
# Runner talks to http://localhost:12000/v1, model = --served-model-name.
# To use your NVFP4 coding checkpoint instead, swap --model for its HF repo.

services:
  # weak tier — the "qwen loops" motivating case. Dense 7B, proven block from
  # the kubelean box (starts fast, no MoE compile).
  qwen2.5:
    image: vllm/vllm-openai:v0.20.0-cu130
    profiles: ["qwen2.5"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct
      - --served-model-name
      - qwen2.5:7b-instruct
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "32"
      - --compilation-config
      - '{"cudagraph_mode": "none"}'
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

  # medium tier — MoE, ~3B active.
  qwen3:
    image: vllm/vllm-openai:v0.20.0-cu130
    profiles: ["qwen3"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stop_grace_period: 60s
    command:
      - --model
      - Qwen/Qwen3-30B-A3B-Instruct-2507
      - --served-model-name
      - qwen3:30b-a3b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      # MoE (Qwen3MoeForCausalLM) triggers torch.compile + FlashInfer MoE
      # autotune, which can hang for a long time on Blackwell/sm_121.
      # enforce-eager skips both → fast, robust startup; runtime cost is
      # negligible for our short agent-loop episodes.
      - --enforce-eager
      - --gpu-memory-utilization
      - "0.90"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "32"
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

  # --- external-validity set: weak/medium models across 4 families ----------
  # All tuned the same way: FP8 weights (fast) + bf16 KV cache (Blackwell has
  # an FP8-KV accuracy bug; 128 GB leaves room), TRITON_ATTN for FP8 on sm_121,
  # enforce-eager (fast, hang-free startup), prefix caching (our prompts share
  # a long prefix across episodes). Each needs a tool-call parser for the agent
  # loop. Repo tags are my best picks — adjust if a checkpoint has moved.

  # Mistral family, 8B, weak. Native FP8 (do NOT add --quantization); the three
  # mistral-format flags are the canonical vLLM recipe.
  ministral-3:
    image: vllm/vllm-openai:latest
    profiles: ["ministral-3"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    stop_grace_period: 60s
    command:
      - --model
      - mistralai/Ministral-3-8B-Instruct-2512
      - --served-model-name
      - ministral-3:8b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --attention-backend
      - TRITON_ATTN
      - --enforce-eager
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "64"
      - --tokenizer-mode
      - mistral
      - --config-format
      - mistral
      - --load-format
      - mistral
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - mistral

  # IBM family, 8B, weak. bf16 (only 8B — fast enough, no FP8 kernel risk).
  granite-3.3:
    image: vllm/vllm-openai:latest
    profiles: ["granite-3.3"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    stop_grace_period: 60s
    command:
      - --model
      - ibm-granite/granite-3.3-8b-instruct
      - --served-model-name
      - granite-3.3:8b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --enforce-eager
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "64"
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - granite

  # Meta family, 8B, weak. Calibrated FP8; Blackwell rules (TRITON_ATTN, bf16 KV).
  llama-3.1:
    image: vllm/vllm-openai:latest
    profiles: ["llama-3.1"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    stop_grace_period: 60s
    command:
      - --model
      - RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8
      - --served-model-name
      - llama-3.1:8b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --attention-backend
      - TRITON_ATTN
      - --enforce-eager
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "64"
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - llama3_json

  # Qwen family, DENSE 14B, medium (bridges weak 7B → strong 30B MoE). Native
  # FP8; Blackwell rules (TRITON_ATTN, bf16 KV, image `latest` for sm_121).
  qwen3-14b:
    image: vllm/vllm-openai:latest
    profiles: ["qwen3-14b"]
    network_mode: host
    ipc: host
    volumes:
      - /home/mikolajsemeniuk/.cache/huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_USE_MODELSCOPE=false
      - MAX_JOBS=4
      - SAFETENSORS_FAST_GPU=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    stop_grace_period: 60s
    command:
      - --model
      - Qwen/Qwen3-14B-FP8
      - --served-model-name
      - qwen3:14b
      - --host
      - 0.0.0.0
      - --port
      - "12000"
      - --attention-backend
      - TRITON_ATTN
      - --enforce-eager
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "16384"
      - --max-num-seqs
      - "64"
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes

volumes:
  vllm-cache:
